[graph]
all-features = true

[advisories]
version = 2
yanked = "warn"
ignore = [
  { id = "RUSTSEC-2024-0436", reason = "paste is unmaintained, dependency of leptos: https://github.com/leptos-rs/leptos/issues/3685" },
]

[licenses]
version = 2
allow = [
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "MIT",
  "Unicode-3.0",
  "Zlib",
]
confidence-threshold = 0.8
# File-level copyleft. The build binary is never distributed, and the crates are unmodified.
exceptions = [
  { crate = "cssparser", allow = ["MPL-2.0"] },
  { crate = "dtoa-short", allow = ["MPL-2.0"] },
]

[licenses.private]
ignore = true

[bans]
multiple-versions = "allow"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
