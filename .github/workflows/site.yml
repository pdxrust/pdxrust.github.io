# Checks every push and pull request, and deploys the default branch to GitHub Pages.
#
# Every step calls a `just` recipe, so moving to another CI only means calling the same recipes.
# Actions are pinned by commit SHA. Pull requests run with a read-only token and no secrets.
name: Site

on:
  push:
    branches: [main]
  pull_request:
  # Daily rebuild, so events that have ended move from the home page to the past page. It only
  # builds and deploys when `just due` says an event ended in the last 48 hours, and the audit job
  # runs every day. 10:17 UTC is 3:17 AM in Portland during daylight saving time.
  schedule:
    - cron: "17 10 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    outputs:
      run: ${{ steps.due.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Feed dates come from each event file's commit history.
          fetch-depth: 0
          persist-credentials: false
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: just@1.41.0,typos@1.49.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - id: due
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = schedule ]; then
            echo "run=$(just due)" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.due.outputs.run == 'true'
        run: just check
      - if: steps.due.outputs.run == 'true'
        run: just lint
      - if: steps.due.outputs.run == 'true'
        run: just test
      - if: steps.due.outputs.run == 'true'
        run: just build

  # Separate from `check` so a newly published advisory doesn't block the daily rebuild.
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: just@1.41.0,cargo-deny@0.19.0
      - run: just audit

  deploy:
    if: >-
      github.event_name != 'pull_request' && github.ref == 'refs/heads/main' &&
      needs.check.outputs.run == 'true'
    needs: check
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: just@1.41.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      # The public address comes from the Pages settings, so a custom domain needs no code change.
      - run: just build "$BASE_URL"
        env:
          BASE_URL: ${{ steps.pages.outputs.base_url }}
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
